    <section class="coffee-page">

        <div class="coffee-header">
            <h1>Our Coffee Selection</h1>

    <p>Choose from our freshly roasted coffee blends.</p>

    <div class="search-container">
        <input type="text"
               id="search"
               placeholder="Search Coffee..."
               onkeyup="searchCoffee()">
    </div>

    <h2 class="section-title">Ethiopian Coffee Collection</h2>

    <div class="product-grid">

        <div class="product-card">
            <img src="coffee/COFFEE-PICS(215).png" alt="Yirgacheffe">
            <h3>Yirgacheffe</h3>
            <p><strong>Price:</strong> K20,000</p>
            <p>Floral and citrus flavour.</p>
            <button onclick="addToCart('Yirgacheffe',20000)">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="coffee/COFFEE-PICS(216).png" alt="Sidamo">
            <h3>Sidamo</h3>
            <p><strong>Price:</strong> K20,500</p>
            <p>Sweet berry notes.</p>
            <button onclick="addToCart('Sidamo',20500)">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="coffee/COFFEE-PICS(217).png" alt="Limu">
            <h3>Limu</h3>
            <p><strong>Price:</strong> K21,000</p>
            <p>Balanced and smooth.</p>
            <button onclick="addToCart('Limu',21000)">Add to Cart</button>
        </div>
